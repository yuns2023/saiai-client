version: 2
updates:
  - package-ecosystem: cargo
    directory: /tools/saiai-core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The SAIAI program's lock file. The kernel (submodule tools/saiai-cli/kernel)
  # updates its dependencies in AITP first; a bump here of a package the
  # kernel locks fails check-kernel-submodule.py until AITP's lock agrees.
  - package-ecosystem: cargo
    directory: /tools/saiai-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /tools/saiai-desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /tools/saiai-desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
