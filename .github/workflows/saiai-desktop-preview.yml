name: SAIAI Desktop Preview

on:
  workflow_dispatch:
  push:
    tags:
      - 'saiai-desktop-v*'

permissions:
  contents: read

concurrency:
  group: saiai-desktop-preview-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DESKTOP_DIR: tools/saiai-desktop

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: tools/saiai-desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            tools/saiai-core -> target
            tools/saiai-desktop/src-tauri -> target

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        working-directory: ${{ env.DESKTOP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Verify aligned public release contract
        run: python3 scripts/saiai-cli/verify-v2-release.py

      - name: Verify desktop frontend
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          pnpm typecheck
          pnpm test:run
          pnpm build

      - name: Verify desktop Rust
        run: |
          cargo fmt --manifest-path tools/saiai-core/Cargo.toml --check
          cargo fmt --manifest-path tools/saiai-desktop/src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path tools/saiai-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/saiai-desktop/src-tauri/Cargo.toml

      - name: Verify desktop tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./tools/saiai-desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "saiai-desktop-v${version}" ]; then
            echo "tag $GITHUB_REF_NAME does not match desktop version $version" >&2
            exit 1
          fi

  build-preview:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: macos-15
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: tools/saiai-desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            tools/saiai-core -> target
            tools/saiai-desktop/src-tauri -> target

      - name: Install Tauri Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        working-directory: ${{ env.DESKTOP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build validation bundles
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        with:
          projectPath: tools/saiai-desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      - name: Upload validation bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saiai-desktop-${{ matrix.platform }}-${{ github.run_id }}
          path: tools/saiai-desktop/src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: macos-15
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: tools/saiai-desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            tools/saiai-core -> target
            tools/saiai-desktop/src-tauri -> target

      - name: Install Tauri Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        working-directory: ${{ env.DESKTOP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Publish tagged Preview
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tools/saiai-desktop
          tauriScript: pnpm tauri
          tagName: saiai-desktop-v__VERSION__
          releaseName: 'SAIAI Desktop Preview v__VERSION__'
          releaseBody: |
            Preview build for the standalone V2-only SAIAI client.

            Known Linux-only dependency: the Tauri 2 GTK3 stack currently resolves
            glib 0.18.5, which is affected by GHSA-wrw7-89jp-8q8g. SAIAI does not
            directly use the affected VariantStrIter API, but the alert remains open.
            Windows and macOS bundles do not include this target-specific GTK3
            dependency. The Linux artifact is Preview-only.

            Automatic updates remain disabled until production signing is configured.
          releaseDraft: false
          prerelease: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}
