name: Client CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The kernel's tests refuse a neutral test brand in everything `aitp`
# prints, writes and carries; this distribution adds its own name here, so
# the public kernel source never spells it.
env:
  AITP_TEST_FOREIGN_NAMES: saiai

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-linux:
    name: Config client
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: tools/saiai-cli -> target

      # The kernel becomes a public repository: no spelling, encoding or
      # internal detail of this distribution may appear in it.
      - name: Scan the kernel for distribution names
        run: |
          python3 scripts/saiai-cli/test-scan-kernel-names.py
          python3 scripts/saiai-cli/scan-kernel-names.py tools/saiai-cli/kernel

      - name: Format
        run: cargo fmt --manifest-path tools/saiai-cli/Cargo.toml --all --check

      - name: Lint
        run: cargo clippy --locked --manifest-path tools/saiai-cli/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml --workspace

      # The contract entries as an outside crate uses them (feature on, the
      # library built without cfg(test)); the steps above build without it.
      - name: Lint and test contract entries
        run: |
          cargo clippy --locked --manifest-path tools/saiai-cli/Cargo.toml --workspace --features contract --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml -p saiai --features contract --lib --test contract_entry --test saiai_render_contract --test kernel_consumer
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml -p proxy-cli --features contract --bin aitp

      # The kernel package (kernel/ alone, as a public repository would hold
      # it) lints with and without the contract entries and passes its own
      # tests outside this workspace, on the workspace's locked dependencies.
      - name: Test the kernel on its own
        run: |
          standalone="$(mktemp -d)"
          cp -R tools/saiai-cli/kernel "$standalone/kernel"
          cp tools/saiai-cli/Cargo.lock "$standalone/kernel/Cargo.lock"
          # Drops the workspace-only entries from the copied lock file ...
          cargo metadata --format-version 1 --manifest-path "$standalone/kernel/Cargo.toml" > /dev/null
          # ... without changing any locked third-party package.
          python3 - "$standalone/kernel/Cargo.lock" tools/saiai-cli/Cargo.lock <<'PY'
          import re, sys
          def packages(path):
              found = {}
              for block in open(path, encoding="utf-8").read().split("[[package]]")[1:]:
                  field = lambda name: (re.search(rf'^{name} = "([^"]*)"', block, re.M) or [None, None])[1]
                  if field("source"):
                      found[(field("name"), field("version"))] = (field("source"), field("checksum"))
              return found
          standalone, workspace = packages(sys.argv[1]), packages(sys.argv[2])
          changed = sorted(key for key, value in standalone.items() if workspace.get(key) != value)
          assert not changed, f"standalone kernel resolves other packages: {changed}"
          print(f"standalone kernel locks {len(standalone)} workspace packages unchanged")
          PY
          cd "$standalone/kernel"
          cargo clippy --locked --target-dir "$standalone/target" --all-targets -- -D warnings
          cargo clippy --locked --target-dir "$standalone/target" --all-targets --features contract -- -D warnings
          cargo test --locked --target-dir "$standalone/target"
          # The AITP program: its brand installs and renders its services
          # (contract entries), and a release build (paths remapped, as
          # published) runs, names no build path and carries the brand's
          # real update signing keys.
          cargo test --locked --target-dir "$standalone/target" --features contract --bin aitp
          python3 scripts/test_release_manifest.py
          aitp="$(CARGO_TARGET_DIR="$standalone/target" bash scripts/build-release.sh --locked)"
          "$aitp" --version
          python3 "$GITHUB_WORKSPACE/scripts/saiai-cli/verify-release.py" \
            --aitp-artifact "$aitp" \
            --build-dir "$standalone" --build-dir "$GITHUB_WORKSPACE"

      - name: Verify official Codex daemon initialization without model turns
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cargo build --locked --manifest-path tools/saiai-cli/Cargo.toml -p saiai --bin saiai
          python3 - <<'PY'
          import hashlib, pathlib, tarfile, urllib.request
          root = pathlib.Path("dist/codex-daemon-regression")
          root.mkdir(parents=True)
          archive = root / "codex.tar.gz"
          urllib.request.urlretrieve("https://github.com/openai/codex/releases/download/rust-v0.162.1/codex-x86_64-unknown-linux-musl.tar.gz", archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == "86f268d81b898f3e144c5ecff2ad2fda2c5802e042d6195b72538fe0fa125057"
          with tarfile.open(archive) as bundle:
              bundle.extractall(root, filter="data")
          PY
          python3 scripts/saiai-cli/test-codex-daemon.py \
            --binary tools/saiai-cli/target/debug/saiai \
            --codex dist/codex-daemon-regression/codex-x86_64-unknown-linux-musl

      - name: Verify public release contract
        run: |
          node --test scripts/saiai-cli/test-vscode-certificates.js
          python3 scripts/saiai-cli/test-release-contract.py
          python3 scripts/saiai-cli/test-brand-contract.py
          python3 tools/saiai-cli/kernel/scripts/test_release_manifest.py
          python3 scripts/saiai-cli/test-installed-codex-desktop-probe.py
          python3 scripts/saiai-cli/test-windows-self-update-polling.py
          bash scripts/saiai-cli/test-setup-wrappers.sh
          python3 scripts/saiai-cli/verify-release.py

  # The AITP release build in the workspace checkout, whose path spells the
  # other distribution's name: with the paths remapped the program carries
  # neither that name nor any build machine path, and an ordinary release
  # build (the control) is caught by the same check.
  aitp-release-linux:
    name: AITP release paths
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'

      - name: Build the AITP release with remapped paths
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          case "$GITHUB_WORKSPACE" in
            *saiai*) ;;
            *) echo "::error::the checkout path no longer names the other distribution"; exit 1 ;;
          esac
          aitp="$(bash tools/saiai-cli/kernel/scripts/build-release.sh --locked)"
          "$aitp" --version
          echo "AITP_PROGRAM=$aitp" >> "$GITHUB_ENV"

      - name: Verify the AITP release names no build path
        run: >-
          python3 scripts/saiai-cli/verify-release.py
          --aitp-artifact "$AITP_PROGRAM"
          --build-dir "$GITHUB_WORKSPACE"

      # The build and the release check refuse placeholder keys: a kernel
      # copy whose brand carries the placeholders does not build, and a
      # program that carries one fails the check.
      - name: Control - placeholder signing keys are refused for a release
        run: |
          copy="$RUNNER_TEMP/placeholder-kernel"
          cp -R tools/saiai-cli/kernel "$copy"
          python3 - "$copy" <<'PY'
          import importlib.util, pathlib, sys
          sys.dont_write_bytecode = True
          copy = pathlib.Path(sys.argv[1])
          spec = importlib.util.spec_from_file_location("rm", copy / "scripts/release_manifest.py")
          rm = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(rm)
          brand = copy / "src/bin/aitp/brand.rs"
          text = brand.read_text(encoding="utf-8")
          keys = rm.brand_keys(text)
          assert len(keys) == len(rm.PLACEHOLDER_KEYS), keys
          for key, placeholder in zip(keys, rm.PLACEHOLDER_KEYS):
              assert text.count(key) >= 1, key
              text = text.replace(key, placeholder)
          brand.write_text(text, encoding="utf-8")
          PY
          if bash "$copy/scripts/build-release.sh" --locked 2> "$RUNNER_TEMP/build.log"; then
            echo "::error::the release build accepted placeholder signing keys"
            exit 1
          fi
          grep "update signing keys are placeholders" "$RUNNER_TEMP/build.log"
          cp "$AITP_PROGRAM" "$RUNNER_TEMP/aitp-placeholder"
          printf '%s' RWQAITPxPRIMARYxPLACEHOLDERxKEYxNOTxFORxRELEASE222222222 >> "$RUNNER_TEMP/aitp-placeholder"
          if python3 scripts/saiai-cli/verify-release.py \
              --aitp-artifact "$RUNNER_TEMP/aitp-placeholder" \
              --build-dir "$GITHUB_WORKSPACE" 2> "$RUNNER_TEMP/keys.log"; then
            echo "::error::the release check accepted placeholder signing keys"
            exit 1
          fi
          grep "carries placeholder signing keys" "$RUNNER_TEMP/keys.log"

      - name: Control - an ordinary release build fails the check
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_TARGET_DIR: ${{ runner.temp }}/aitp-plain
        run: |
          cargo build --locked --manifest-path tools/saiai-cli/kernel/Cargo.toml --release --bin aitp
          if python3 scripts/saiai-cli/verify-release.py \
              --aitp-artifact "$CARGO_TARGET_DIR/release/aitp" \
              --build-dir "$GITHUB_WORKSPACE" 2> "$RUNNER_TEMP/control.log"; then
            echo "::error::the path check accepted an ordinary release build"
            exit 1
          fi
          cat "$RUNNER_TEMP/control.log"
          grep -E "carries build machine paths|names the other distribution" "$RUNNER_TEMP/control.log"

  static-linux:
    name: Static Linux client (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: saiai-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            asset: saiai-linux-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools linux-libc-dev

      - name: Build static Linux release binary
        env:
          CC: musl-gcc
          CARGO_BUILD_JOBS: 2
        run: bash scripts/saiai-cli/build-linux.sh "${{ matrix.target }}"

      - name: Verify Linux portability and startup
        run: |
          mkdir -p dist
          cp "tools/saiai-cli/target/${{ matrix.target }}/release/saiai" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          python3 scripts/saiai-cli/verify-linux-portability.py "dist/${{ matrix.asset }}"
          python3 scripts/saiai-cli/verify-release.py --artifact "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" --version
          "dist/${{ matrix.asset }}" --help >/dev/null

      - name: Verify TLS without getrandom (old-kernel fallback)
        run: >-
          python3 scripts/saiai-cli/test-linux-entropy.py
          --binary dist/${{ matrix.asset }}

      - name: Verify provider and project configuration isolation
        run: >-
          python3 scripts/saiai-cli/test-initialization-scope.py
          --binary dist/${{ matrix.asset }}

      - name: Smoke-test Linux headless service fallback
        run: >-
          python3 scripts/saiai-cli/test-linux-service.py
          --binary dist/${{ matrix.asset }}

      - name: Verify concurrent environment isolation
        run: >-
          python3 scripts/saiai-cli/test-environment-isolation.py
          --binary dist/${{ matrix.asset }}

      - name: Verify uninstall removes only SAIAI-owned state
        run: >-
          python3 scripts/saiai-cli/test-uninstall.py
          --binary dist/${{ matrix.asset }}

  client-windows:
    name: Native Windows config client
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify read-only Windows certificate inventory
        run: >-
          python -c "import runpy; runpy.run_path('scripts/saiai-cli/test-initialization-scope.py')['windows_roots'](); print('Windows Root inventory read passed')"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: tools/saiai-cli -> target

      - name: Verify native Windows Desktop runtime
        shell: bash
        run: bash scripts/saiai-cli/cargo-test-filtered.sh proxy-cli windows_desktop_runtime::tests -- --test-threads=1

      - name: Test and build native Windows client
        shell: bash
        run: |
          node --test scripts/saiai-cli/test-vscode-certificates.js
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml --workspace
          # Platform-specific SAIAI goldens (LaunchAgent plist, Windows update
          # helper) run through the contract entries on this platform.
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml -p saiai --features contract --lib --test saiai_render_contract --test kernel_consumer
          # The AITP brand installs and renders its services on this platform.
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml -p proxy-cli --features contract --bin aitp
          cargo build --locked --manifest-path tools/saiai-cli/Cargo.toml -p saiai --bin saiai

      - name: Smoke-test Windows configuration
        shell: pwsh
        run: |
          & "$PWD/scripts/saiai-cli/test-windows-runtime.ps1" `
            -BinaryPath "$PWD/tools/saiai-cli/target/debug/saiai.exe"

      - name: Verify reproducible Windows image
        run: python scripts/saiai-cli/verify-windows-reproducibility.py tools/saiai-cli/target/debug/saiai.exe

      - name: Verify provider initialization preserves editor and certificate stores
        run: python scripts/saiai-cli/test-initialization-scope.py --binary tools/saiai-cli/target/debug/saiai.exe

      - name: Verify native Windows environment lifecycle isolation
        timeout-minutes: 5
        run: python scripts/saiai-cli/test-windows-environments.py --binary tools/saiai-cli/target/debug/saiai.exe

      - name: Verify Windows installer environment routing
        shell: pwsh
        run: |
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File scripts/saiai-cli/test-setup-environments.ps1 -WrapperPath "$PWD/scripts/saiai-cli/setup.ps1"

      - name: Smoke-test Windows PowerShell 5.1 setup wrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "$PWD/tools/saiai-cli/target/debug/saiai.exe" "$PWD/dist/saiai-windows-x86_64.exe"
          Copy-Item "$PWD/scripts/saiai-cli/setup.sh", "$PWD/scripts/saiai-cli/setup.ps1", "$PWD/scripts/saiai-cli/setup.cmd" "$PWD/dist/"
          python scripts/saiai-cli/generate-manifest.py `
            --dist dist `
            --cargo-toml tools/saiai-cli/Cargo.toml `
            --asset saiai-windows-x86_64.exe `
            --wrappers-dir dist `
            --output dist/manifest.json
          & "$PWD/scripts/saiai-cli/test-windows-release.ps1" `
            -BundleDir dist `
            -SetupPs1 dist/setup.ps1 `
            -SetupCmd dist/setup.cmd `
            -AssetName saiai-windows-x86_64.exe

      - name: Smoke-test native Windows self-update with active proxy
        shell: pwsh
        run: python scripts/saiai-cli/test-windows-self-update.py --binary dist/saiai-windows-x86_64.exe

      - name: Capture official Windows Codex through local proxy
        shell: pwsh
        run: |
          foreach ($version in @("0.146.0", "0.153.4")) {
            $prefix = Join-Path $env:RUNNER_TEMP "codex-$version"
            npm install --global --prefix $prefix "@openai/codex@$version"
            python scripts/saiai-cli/test-windows-codex-proxy.py `
              --saiai tools/saiai-cli/target/debug/saiai.exe `
              --codex-prefix $prefix `
              --codex-version $version
          }

  client-macos:
    name: Native macOS local proxy (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: tools/saiai-cli -> target

      - name: Test and build native macOS client
        run: |
          node --test scripts/saiai-cli/test-vscode-certificates.js
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml --workspace
          # Platform-specific SAIAI goldens (LaunchAgent plist, Windows update
          # helper) run through the contract entries on this platform.
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml -p saiai --features contract --lib --test saiai_render_contract --test kernel_consumer
          # The AITP brand installs and renders its services on this platform.
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml -p proxy-cli --features contract --bin aitp
          cargo build --locked --manifest-path tools/saiai-cli/Cargo.toml -p saiai --bin saiai

      - name: Verify provider and project configuration isolation
        run: >-
          python3 scripts/saiai-cli/test-initialization-scope.py
          --binary tools/saiai-cli/target/debug/saiai

      - name: Smoke-test macOS LaunchAgent lifecycle
        run: >-
          python3 scripts/saiai-cli/test-macos-service.py
          --binary tools/saiai-cli/target/debug/saiai

      - name: Verify native macOS environment lifecycle isolation
        run: >-
          python3 scripts/saiai-cli/test-macos-environments.py
          --binary tools/saiai-cli/target/debug/saiai

      - name: Capture official macOS Codex through local proxy
        if: matrix.arch == 'arm64'
        run: |
          prefix="$RUNNER_TEMP/codex-0.153.4"
          npm install --global --prefix "$prefix" @openai/codex@0.153.4
          python3 scripts/saiai-cli/test-windows-codex-proxy.py \
            --saiai tools/saiai-cli/target/debug/saiai \
            --codex-prefix "$prefix/bin" \
            --codex-version 0.153.4
