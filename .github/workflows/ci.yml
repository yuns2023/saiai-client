name: Client CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-linux:
    name: Config client
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: tools/saiai-cli -> target

      - name: Format
        run: cargo fmt --manifest-path tools/saiai-cli/Cargo.toml --check

      - name: Lint
        run: cargo clippy --locked --manifest-path tools/saiai-cli/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml

      - name: Verify public release contract
        run: |
          bash scripts/saiai-cli/test-setup-wrappers.sh
          python3 scripts/saiai-cli/verify-release.py

  static-linux:
    name: Static Linux client (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: saiai-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            asset: saiai-linux-aarch64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build static Linux release binary
        env:
          CC: musl-gcc
          CARGO_BUILD_JOBS: 2
        run: cargo build --locked --manifest-path tools/saiai-cli/Cargo.toml --release --target ${{ matrix.target }}

      - name: Verify Linux portability and startup
        run: |
          mkdir -p dist
          cp "tools/saiai-cli/target/${{ matrix.target }}/release/saiai" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          python3 scripts/saiai-cli/verify-linux-portability.py "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" --version
          "dist/${{ matrix.asset }}" --help >/dev/null

      - name: Smoke-test Linux headless service fallback
        run: >-
          python3 scripts/saiai-cli/test-linux-service.py
          --binary dist/${{ matrix.asset }}

  client-windows:
    name: Native Windows config client
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: tools/saiai-cli -> target

      - name: Test and build native Windows client
        run: |
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml
          cargo build --locked --manifest-path tools/saiai-cli/Cargo.toml

      - name: Smoke-test Windows configuration
        shell: pwsh
        run: |
          & "$PWD/scripts/saiai-cli/test-windows-runtime.ps1" `
            -BinaryPath "$PWD/tools/saiai-cli/target/debug/saiai.exe"

  client-macos:
    name: Native macOS local proxy (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: tools/saiai-cli -> target

      - name: Test and build native macOS client
        run: |
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml
          cargo build --locked --manifest-path tools/saiai-cli/Cargo.toml

      - name: Smoke-test macOS LaunchAgent lifecycle
        run: >-
          python3 scripts/saiai-cli/test-macos-service.py
          --binary tools/saiai-cli/target/debug/saiai
