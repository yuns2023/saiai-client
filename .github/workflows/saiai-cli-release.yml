name: SAIAI CLI Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'saiai-v*'

permissions:
  contents: read

concurrency:
  group: saiai-cli-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: tools/saiai-cli -> target

      - name: Format
        run: cargo fmt --manifest-path tools/saiai-cli/Cargo.toml --check

      - name: Lint
        run: cargo clippy --locked --manifest-path tools/saiai-cli/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml

      - name: Verify standalone release contract
        run: |
          bash scripts/saiai-cli/test-setup-wrappers.sh
          python3 scripts/saiai-cli/verify-release.py

  build:
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: saiai-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            asset: saiai-linux-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: saiai-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: saiai-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: saiai-windows-x86_64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: saiai-windows-aarch64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}

      - name: Install musl build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build static Linux release binary
        if: runner.os == 'Linux'
        env:
          CC: musl-gcc
          CARGO_BUILD_JOBS: 2
        run: cargo build --locked --manifest-path tools/saiai-cli/Cargo.toml --release --target ${{ matrix.target }}

      - name: Build release binary
        if: runner.os != 'Linux'
        run: cargo build --locked --manifest-path tools/saiai-cli/Cargo.toml --release --target ${{ matrix.target }}

      - name: Smoke-test native macOS LaunchAgent lifecycle
        if: runner.os == 'macOS'
        run: >-
          python3 scripts/saiai-cli/test-macos-service.py
          --binary tools/saiai-cli/target/${{ matrix.target }}/release/saiai

      - name: Smoke-test native Windows local proxy runtime
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          & "$PWD/scripts/saiai-cli/test-windows-runtime.ps1" `
            -BinaryPath "$PWD/tools/saiai-cli/target/${{ matrix.target }}/release/saiai.exe"

      - name: Prepare release fixture
        shell: bash
        run: |
          mkdir -p dist
          binary="tools/saiai-cli/target/${{ matrix.target }}/release/saiai"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          cp "$binary" "dist/${{ matrix.asset }}"
          cp scripts/saiai-cli/setup.sh scripts/saiai-cli/setup.ps1 scripts/saiai-cli/setup.cmd dist/
          chmod +x dist/setup.sh dist/saiai-linux-* dist/saiai-macos-* 2>/dev/null || true
          python scripts/saiai-cli/generate-manifest.py \
            --dist dist \
            --cargo-toml tools/saiai-cli/Cargo.toml \
            --asset "${{ matrix.asset }}" \
            --wrappers-dir dist \
            --output dist/manifest.json

      - name: Verify Linux release portability
        if: runner.os == 'Linux'
        run: python3 scripts/saiai-cli/verify-linux-portability.py "dist/${{ matrix.asset }}"

      - name: Smoke-test Linux headless service fallback
        if: runner.os == 'Linux'
        run: >-
          python3 scripts/saiai-cli/test-linux-service.py
          --binary dist/${{ matrix.asset }}

      - name: Smoke-test native Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ runner.os }}-$(uname -m)" in
            Linux-x86_64) native_asset=saiai-linux-x86_64 ;;
            Linux-aarch64|Linux-arm64) native_asset=saiai-linux-aarch64 ;;
            macOS-x86_64) native_asset=saiai-macos-x86_64 ;;
            macOS-arm64) native_asset=saiai-macos-aarch64 ;;
            *) echo "No native wrapper smoke for ${{ runner.os }} $(uname -m)"; exit 0 ;;
          esac
          if [ "${{ matrix.asset }}" != "$native_asset" ]; then
            echo "Skipping cross-built ${{ matrix.asset }} on $(uname -m)"
            exit 0
          fi
          python3 scripts/saiai-cli/test-release-bundle.py \
            --bundle dist \
            --setup-sh dist/setup.sh \
            --asset "${{ matrix.asset }}"

      - name: Smoke-test native Windows bundle
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          & "$PWD/scripts/saiai-cli/test-windows-release.ps1" `
            -BundleDir dist `
            -SetupPs1 dist/setup.ps1 `
            -SetupCmd dist/setup.cmd `
            -AssetName "${{ matrix.asset }}"

      - name: Upload target binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  package-preview:
    name: Package validation bundle
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: Assemble and verify public bundle
        run: |
          mkdir -p dist
          find release-assets -maxdepth 2 -type f -exec cp {} dist/ \;
          cp scripts/saiai-cli/setup.sh scripts/saiai-cli/setup.ps1 scripts/saiai-cli/setup.cmd dist/
          chmod +x dist/setup.sh dist/saiai-linux-* dist/saiai-macos-*
          python3 scripts/saiai-cli/verify-linux-portability.py \
            dist/saiai-linux-x86_64 \
            dist/saiai-linux-aarch64
          python3 scripts/saiai-cli/generate-manifest.py \
            --dist dist \
            --cargo-toml tools/saiai-cli/Cargo.toml \
            --wrappers-dir dist \
            --output dist/manifest.json
          python3 scripts/saiai-cli/verify-release.py
          python3 scripts/saiai-cli/test-release-bundle.py \
            --bundle dist \
            --setup-sh dist/setup.sh

      - name: Upload validation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saiai-cli-preview-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: Verify tag and assemble release
        shell: bash
        run: |
          version="$(awk -F '"' '/^[[:space:]]*version[[:space:]]*=/{print $2; exit}' tools/saiai-cli/Cargo.toml)"
          tag="${GITHUB_REF_NAME#saiai-v}"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match CLI version $version" >&2
            exit 1
          fi
          mkdir -p dist
          find release-assets -maxdepth 2 -type f -exec cp {} dist/ \;
          cp scripts/saiai-cli/setup.sh scripts/saiai-cli/setup.ps1 scripts/saiai-cli/setup.cmd dist/
          chmod +x dist/setup.sh dist/saiai-linux-* dist/saiai-macos-*
          python3 scripts/saiai-cli/verify-linux-portability.py \
            dist/saiai-linux-x86_64 \
            dist/saiai-linux-aarch64
          python3 scripts/saiai-cli/generate-manifest.py \
            --dist dist \
            --cargo-toml tools/saiai-cli/Cargo.toml \
            --wrappers-dir dist \
            --output dist/manifest.json
          python3 scripts/saiai-cli/test-release-bundle.py \
            --bundle dist \
            --setup-sh dist/setup.sh

      - name: Verify immutable release preconditions
        id: immutable_release_preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/saiai-cli/verify-github-release-draft.py \
            --dist dist \
            --local-only

          release_json="$(mktemp)"
          trap 'rm -f "$release_json"' EXIT
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            >"$release_json" 2>/dev/null; then
            if python3 -c 'import json, sys; raise SystemExit(0 if json.load(sys.stdin).get("draft") is True else 1)' \
              <"$release_json"; then
              echo "already_published=false" >>"$GITHUB_OUTPUT"
            else
              python3 scripts/saiai-cli/verify-github-release-draft.py \
                --dist dist \
                --tag "$GITHUB_REF_NAME" \
                --state published \
                <"$release_json"
              echo "already_published=true" >>"$GITHUB_OUTPUT"
            fi
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" >/dev/null
            echo "already_published=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload immutable release draft
        id: immutable_release_draft
        if: steps.immutable_release_preflight.outputs.already_published != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: SAIAI CLI ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/manifest.json
            dist/saiai-linux-aarch64
            dist/saiai-linux-x86_64
            dist/saiai-macos-aarch64
            dist/saiai-macos-x86_64
            dist/saiai-windows-aarch64.exe
            dist/saiai-windows-x86_64.exe
            dist/setup.cmd
            dist/setup.ps1
            dist/setup.sh

      - name: Verify and publish immutable release
        if: steps.immutable_release_preflight.outputs.already_published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.immutable_release_draft.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          release_json="$(mktemp)"
          trap 'rm -f "$release_json"' EXIT

          gh api "$release_endpoint" >"$release_json"
          if ! python3 scripts/saiai-cli/verify-github-release-draft.py \
            --dist dist \
            --tag "$GITHUB_REF_NAME" \
            --state draft \
            <"$release_json"; then
            if [ "$(gh api "$release_endpoint" --jq '.draft' 2>/dev/null || true)" = "true" ]; then
              gh api --method DELETE "$release_endpoint"
            fi
            exit 1
          fi

          publish_status=0
          payload='{"draft":false,"prerelease":false}'
          printf '%s' "$payload" |
            gh api --method PATCH "$release_endpoint" --input - >/dev/null || publish_status=$?

          for attempt in 1 2 3 4 5; do
            if gh api "$release_endpoint" >"$release_json" &&
              python3 scripts/saiai-cli/verify-github-release-draft.py \
                --dist dist \
                --tag "$GITHUB_REF_NAME" \
                --state published \
                <"$release_json"; then
              exit 0
            fi
            sleep 2
          done
          echo "immutable release postcondition failed (publish status $publish_status)" >&2
          exit 1
