name: SAIAI CLI Release

# Three runs, chosen by how the workflow starts (job "mode"):
# - preview: run by hand on a branch with publish_confirmation empty. Builds,
#   tests natively on all six platforms and uploads the validation bundle.
# - draft: pushing a saiai-v* tag. The same build and native tests, then the
#   assets go up as a verified DRAFT release; nothing is published.
# - publish: run by hand on that tag with publish_confirmation set to
#   "publish <tag>". Re-checks the draft and publishes it (immutable).
# The confirmation guards trusted maintainers against an accidental publish
# (environment approval does not apply to a private repository on GitHub
# Free): pushing a tag alone never publishes anything. It is not a security
# boundary against someone who can change workflows (a tag whose workflow
# file was edited runs that edit; environment approval never stopped that
# either). The public download mirror is updated by the
# operator's own tooling, never by this workflow.
on:
  workflow_dispatch:
    inputs:
      publish_confirmation:
        description: 'Empty for a preview. To publish the draft of a saiai-v* tag, run on that tag and type: publish <tag>'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'saiai-v*'

permissions:
  contents: read

concurrency:
  group: saiai-cli-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  mode:
    name: Release gate
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Choose preview, draft or publish
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          CONFIRMATION: ${{ inputs.publish_confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EVENT:$REF" in
            push:refs/tags/saiai-v*)
              mode=draft ;;
            workflow_dispatch:refs/tags/saiai-v*)
              if [ "$CONFIRMATION" != "publish $REF_NAME" ]; then
                echo "::error::to publish, run on the tag with publish_confirmation: publish $REF_NAME" >&2
                exit 1
              fi
              mode=publish ;;
            workflow_dispatch:refs/heads/*)
              if [ -n "$CONFIRMATION" ]; then
                echo "::error::only a run on a saiai-v* tag publishes; leave publish_confirmation empty for a preview" >&2
                exit 1
              fi
              mode=preview ;;
            *)
              echo "::error::unsupported trigger $EVENT on $REF" >&2
              exit 1 ;;
          esac
          if [ "$mode" != preview ]; then
            # Without branch or tag protection, a release tag must point into main.
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)"
            case "$status" in
              identical|ahead) ;;
              *)
                echo "::error::$REF_NAME ($GITHUB_SHA) is not on main (compare status: $status)" >&2
                exit 1 ;;
            esac
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"

  verify:
    needs: mode
    if: needs.mode.outputs.mode == 'preview' || needs.mode.outputs.mode == 'draft'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: tools/saiai-cli -> target

      - name: Format
        run: cargo fmt --manifest-path tools/saiai-cli/Cargo.toml --all --check

      - name: Lint
        run: cargo clippy --locked --manifest-path tools/saiai-cli/Cargo.toml --workspace --all-targets -- -D warnings

      # The pinned kernel commit is checked out and on AITP's main (see ci.yml).
      - name: Check the kernel submodule
        run: python3 scripts/saiai-cli/check-kernel-submodule.py

      - name: Scan the kernel for distribution names
        run: |
          python3 scripts/saiai-cli/test-scan-kernel-names.py
          python3 scripts/saiai-cli/scan-kernel-names.py tools/saiai-cli/kernel

      - name: Test
        run: cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml --workspace
        env:
          # The kernel's tests also refuse this distribution's name (see ci.yml).
          AITP_TEST_FOREIGN_NAMES: saiai

      - name: Test contract entries
        run: cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml -p saiai --features contract --lib --test contract_entry --test saiai_render_contract --test kernel_consumer

      - name: Install the workflow parser
        run: python3 -m pip install --disable-pip-version-check --no-deps --only-binary pyyaml --require-hashes -r scripts/saiai-cli/requirements-verify.txt

      - name: Verify standalone release contract
        run: |
          node --test scripts/saiai-cli/test-vscode-certificates.js
          python3 scripts/saiai-cli/test-release-contract.py
          python3 scripts/saiai-cli/test-github-release-draft.py
          python3 scripts/saiai-cli/test-fetch-github-release.py
          python3 scripts/saiai-cli/test-installed-codex-desktop-probe.py
          python3 scripts/saiai-cli/test-windows-self-update-polling.py
          bash scripts/saiai-cli/test-setup-wrappers.sh
          python3 scripts/saiai-cli/verify-release.py

  build:
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: saiai-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            asset: saiai-linux-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: saiai-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: saiai-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: saiai-windows-x86_64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: saiai-windows-aarch64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}

      - name: Verify VSCode certificate guard
        run: node --test scripts/saiai-cli/test-vscode-certificates.js

      - name: Verify read-only Windows certificate inventory
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: >-
          python -c "import runpy; runpy.run_path('scripts/saiai-cli/test-initialization-scope.py')['windows_roots'](); print('Windows Root inventory read passed')"

      - name: Install musl build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools linux-libc-dev

      - name: Build static Linux release binary
        if: runner.os == 'Linux'
        env:
          CC: musl-gcc
          CARGO_BUILD_JOBS: 2
        run: bash scripts/saiai-cli/build-linux.sh "${{ matrix.target }}"

      - name: Build release binary
        if: runner.os != 'Linux'
        run: cargo build --locked --manifest-path tools/saiai-cli/Cargo.toml -p saiai --bin saiai --release --target ${{ matrix.target }}

      # Everyday CI runs on Linux only, so the release (every preview and tag)
      # runs the whole workspace natively here: the kernel (whose source still
      # lives in this repository), the platform-gated SAIAI goldens
      # (LaunchAgent plist, Windows update helper) and the AITP brand's
      # services through the contract entries.
      - name: Test the workspace on this platform
        if: runner.os == 'macOS' || matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        env:
          # The kernel's tests also refuse this distribution's name (see ci.yml).
          AITP_TEST_FOREIGN_NAMES: saiai
        run: |
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml --workspace
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml -p saiai --features contract --lib --test contract_entry --test saiai_render_contract --test kernel_consumer
          cargo test --locked --manifest-path tools/saiai-cli/Cargo.toml -p proxy-cli --features contract --bin aitp

      - name: Verify native Windows Desktop runtime
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          bash scripts/saiai-cli/cargo-test-filtered.sh proxy-cli windows_desktop_runtime::tests -- --test-threads=1
          bash scripts/saiai-cli/cargo-test-filtered.sh proxy-cli vscode::tests -- --test-threads=1

      - name: Verify reproducible Windows image
        if: runner.os == 'Windows'
        run: python scripts/saiai-cli/verify-windows-reproducibility.py tools/saiai-cli/target/${{ matrix.target }}/release/saiai.exe

      - name: Smoke-test native macOS LaunchAgent lifecycle
        if: runner.os == 'macOS'
        run: >-
          python3 scripts/saiai-cli/test-macos-service.py
          --binary tools/saiai-cli/target/${{ matrix.target }}/release/saiai

      - name: Verify native macOS environment lifecycle isolation
        if: runner.os == 'macOS'
        run: >-
          python3 scripts/saiai-cli/test-macos-environments.py
          --binary tools/saiai-cli/target/${{ matrix.target }}/release/saiai

      - name: Capture official macOS Codex through local proxy
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          prefix="$RUNNER_TEMP/codex-0.153.4"
          npm install --global --prefix "$prefix" @openai/codex@0.153.4
          python3 scripts/saiai-cli/test-windows-codex-proxy.py \
            --saiai tools/saiai-cli/target/${{ matrix.target }}/release/saiai \
            --codex-prefix "$prefix/bin" \
            --codex-version 0.153.4

      - name: Smoke-test native Windows local proxy runtime
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          & "$PWD/scripts/saiai-cli/test-windows-runtime.ps1" `
            -BinaryPath "$PWD/tools/saiai-cli/target/${{ matrix.target }}/release/saiai.exe"

      - name: Verify Windows UTF-8 log reading
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: python scripts/saiai-cli/test-windows-log-encoding.py --binary tools/saiai-cli/target/${{ matrix.target }}/release/saiai.exe

      - name: Verify native Windows environment lifecycle isolation
        if: matrix.target == 'x86_64-pc-windows-msvc'
        timeout-minutes: 5
        run: python scripts/saiai-cli/test-windows-environments.py --binary tools/saiai-cli/target/${{ matrix.target }}/release/saiai.exe

      - name: Verify Windows installer environment routing
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File scripts/saiai-cli/test-setup-environments.ps1 -WrapperPath "$PWD/scripts/saiai-cli/setup.ps1"

      # Each native command's exit status counts, not only the last one.
      - name: Capture official Windows Codex through local proxy
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --global --prefix "$env:RUNNER_TEMP/codex-0.146.0" "@openai/codex@0.146.0"
          python scripts/saiai-cli/test-windows-codex-proxy.py --saiai tools/saiai-cli/target/${{ matrix.target }}/release/saiai.exe --codex-prefix "$env:RUNNER_TEMP/codex-0.146.0" --codex-version 0.146.0
          npm install --global --prefix "$env:RUNNER_TEMP/codex-0.153.4" "@openai/codex@0.153.4"
          python scripts/saiai-cli/test-windows-codex-proxy.py --saiai tools/saiai-cli/target/${{ matrix.target }}/release/saiai.exe --codex-prefix "$env:RUNNER_TEMP/codex-0.153.4" --codex-version 0.153.4

      - name: Prepare release fixture
        shell: bash
        run: |
          mkdir -p dist
          binary="tools/saiai-cli/target/${{ matrix.target }}/release/saiai"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          cp "$binary" "dist/${{ matrix.asset }}"
          cp scripts/saiai-cli/setup.sh scripts/saiai-cli/setup.ps1 scripts/saiai-cli/setup.cmd dist/
          chmod +x dist/setup.sh dist/saiai-linux-* dist/saiai-macos-* 2>/dev/null || true
          python scripts/saiai-cli/generate-manifest.py \
            --dist dist \
            --cargo-toml tools/saiai-cli/Cargo.toml \
            --asset "${{ matrix.asset }}" \
            --wrappers-dir dist \
            --output dist/manifest.json

      - name: Verify Linux release portability and startup
        if: runner.os == 'Linux'
        run: |
          python3 scripts/saiai-cli/verify-linux-portability.py "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" --version
          "dist/${{ matrix.asset }}" --help >/dev/null

      - name: Verify provider initialization without editor or root-store changes
        if: matrix.target != 'aarch64-pc-windows-msvc'
        run: python scripts/saiai-cli/test-initialization-scope.py --binary dist/${{ matrix.asset }}

      - name: Verify TLS without getrandom (old-kernel fallback)
        if: runner.os == 'Linux'
        run: >-
          python3 scripts/saiai-cli/test-linux-entropy.py
          --binary dist/${{ matrix.asset }}

      - name: Smoke-test Linux headless service fallback
        if: runner.os == 'Linux'
        run: >-
          python3 scripts/saiai-cli/test-linux-service.py
          --binary dist/${{ matrix.asset }}

      - name: Verify concurrent environment isolation
        if: runner.os == 'Linux'
        run: >-
          python3 scripts/saiai-cli/test-environment-isolation.py
          --binary dist/${{ matrix.asset }}

      - name: Verify uninstall removes only SAIAI-owned state
        if: runner.os == 'Linux'
        run: >-
          python3 scripts/saiai-cli/test-uninstall.py
          --binary dist/${{ matrix.asset }}

      # Every Unix matrix entry builds for its own runner.
      - name: Smoke-test native Unix bundle
        if: runner.os != 'Windows'
        run: >-
          python3 scripts/saiai-cli/test-release-bundle.py
          --bundle dist
          --setup-sh dist/setup.sh
          --asset "${{ matrix.asset }}"

      - name: Smoke-test native Windows bundle and Windows PowerShell 5.1 setup wrapper
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          & "$PWD/scripts/saiai-cli/test-windows-release.ps1" `
            -BundleDir dist `
            -SetupPs1 dist/setup.ps1 `
            -SetupCmd dist/setup.cmd `
            -AssetName "${{ matrix.asset }}"

      - name: Smoke-test native Windows self-update with active proxy
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: python scripts/saiai-cli/test-windows-self-update.py --binary dist/${{ matrix.asset }}

      - name: Upload target binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  package-preview:
    name: Package validation bundle
    needs: [mode, build]
    if: needs.mode.outputs.mode == 'preview'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          # The six programs only (not a bundle or digests of an earlier attempt).
          pattern: saiai-[lmw]*

      - name: Install the workflow parser
        run: python3 -m pip install --disable-pip-version-check --no-deps --only-binary pyyaml --require-hashes -r scripts/saiai-cli/requirements-verify.txt

      - name: Assemble and verify public bundle
        run: |
          mkdir -p dist
          cp release-assets/*/* dist/
          cp scripts/saiai-cli/setup.sh scripts/saiai-cli/setup.ps1 scripts/saiai-cli/setup.cmd dist/
          chmod +x dist/setup.sh dist/saiai-linux-* dist/saiai-macos-*
          python3 scripts/saiai-cli/verify-linux-portability.py \
            dist/saiai-linux-x86_64 \
            dist/saiai-linux-aarch64
          python3 scripts/saiai-cli/generate-manifest.py \
            --dist dist \
            --cargo-toml tools/saiai-cli/Cargo.toml \
            --wrappers-dir dist \
            --output dist/manifest.json
          python3 scripts/saiai-cli/verify-release.py \
            --artifact dist/saiai-linux-x86_64 \
            --artifact dist/saiai-linux-aarch64 \
            --artifact dist/saiai-macos-x86_64 \
            --artifact dist/saiai-macos-aarch64 \
            --artifact dist/saiai-windows-x86_64.exe \
            --artifact dist/saiai-windows-aarch64.exe
          python3 scripts/saiai-cli/test-release-bundle.py \
            --bundle dist \
            --setup-sh dist/setup.sh

      - name: Upload validation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saiai-cli-preview-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Upload verified release draft
    needs: [mode, build]
    if: needs.mode.outputs.mode == 'draft'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          # The six programs only (not a bundle or digests of an earlier attempt).
          pattern: saiai-[lmw]*

      - name: Verify tag and assemble release
        shell: bash
        run: |
          version="$(awk -F '"' '/^[[:space:]]*version[[:space:]]*=/{print $2; exit}' tools/saiai-cli/Cargo.toml)"
          tag="${GITHUB_REF_NAME#saiai-v}"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match CLI version $version" >&2
            exit 1
          fi
          mkdir -p dist
          cp release-assets/*/* dist/
          cp scripts/saiai-cli/setup.sh scripts/saiai-cli/setup.ps1 scripts/saiai-cli/setup.cmd dist/
          chmod +x dist/setup.sh dist/saiai-linux-* dist/saiai-macos-*
          python3 scripts/saiai-cli/verify-linux-portability.py \
            dist/saiai-linux-x86_64 \
            dist/saiai-linux-aarch64
          python3 scripts/saiai-cli/generate-manifest.py \
            --dist dist \
            --cargo-toml tools/saiai-cli/Cargo.toml \
            --wrappers-dir dist \
            --output dist/manifest.json
          python3 scripts/saiai-cli/test-release-bundle.py \
            --bundle dist \
            --setup-sh dist/setup.sh

      - name: Verify release preconditions
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/saiai-cli/verify-github-release-draft.py \
            --dist dist \
            --local-only

          release_json="$(mktemp)"
          trap 'rm -f "$release_json"' EXIT
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            >"$release_json" 2>/dev/null; then
            if python3 -c 'import json, sys; raise SystemExit(0 if json.load(sys.stdin).get("draft") is True else 1)' \
              <"$release_json"; then
              echo "already_published=false" >>"$GITHUB_OUTPUT"
            else
              python3 scripts/saiai-cli/verify-github-release-draft.py \
                --dist dist \
                --tag "$GITHUB_REF_NAME" \
                --state published \
                <"$release_json"
              echo "already_published=true" >>"$GITHUB_OUTPUT"
            fi
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" >/dev/null
            echo "already_published=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload release draft
        id: upload
        if: steps.preflight.outputs.already_published != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: SAIAI CLI ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/manifest.json
            dist/saiai-linux-aarch64
            dist/saiai-linux-x86_64
            dist/saiai-macos-aarch64
            dist/saiai-macos-x86_64
            dist/saiai-windows-aarch64.exe
            dist/saiai-windows-x86_64.exe
            dist/setup.cmd
            dist/setup.ps1
            dist/setup.sh

      # The draft stays a draft: publishing is the separate, confirmed run.
      - name: Verify the uploaded draft
        if: steps.preflight.outputs.already_published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          release_json="$(mktemp)"
          trap 'rm -f "$release_json"' EXIT
          gh api "$release_endpoint" >"$release_json"
          if ! python3 scripts/saiai-cli/verify-github-release-draft.py \
            --dist dist \
            --tag "$GITHUB_REF_NAME" \
            --state draft \
            <"$release_json"; then
            if [ "$(gh api "$release_endpoint" --jq '.draft' 2>/dev/null || true)" = "true" ]; then
              gh api --method DELETE "$release_endpoint"
            fi
            exit 1
          fi
          echo "::notice::draft ready; publish with: gh workflow run 'SAIAI CLI Release' --ref $GITHUB_REF_NAME -f publish_confirmation='publish $GITHUB_REF_NAME'"

      # The publish run accepts only assets with exactly these digests.
      - name: Record the release digests
        run: sha256sum dist/manifest.json dist/saiai-linux-aarch64 dist/saiai-linux-x86_64 dist/saiai-macos-aarch64 dist/saiai-macos-x86_64 dist/saiai-windows-aarch64.exe dist/saiai-windows-x86_64.exe dist/setup.cmd dist/setup.ps1 dist/setup.sh > release-digests.sha256

      - name: Upload the release digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digests
          path: release-digests.sha256
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish the verified draft
    needs: mode
    if: needs.mode.outputs.mode == 'publish'
    # Not a gate on a private repository on GitHub Free (approval is ignored
    # there); the confirmation checked by job "mode" is.
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the workflow parser
        run: python3 -m pip install --disable-pip-version-check --no-deps --only-binary pyyaml --require-hashes -r scripts/saiai-cli/requirements-verify.txt

      # Only the release that a successful tag run of this commit uploaded.
      - name: Fetch the release of this tag
        id: fetch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^[[:space:]]*version[[:space:]]*=/{print $2; exit}' tools/saiai-cli/Cargo.toml)"
          if [ "$GITHUB_REF_NAME" != "saiai-v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match CLI version $version" >&2
            exit 1
          fi
          python3 scripts/saiai-cli/fetch-github-release.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" \
            --dist dist \
            --release-json "$RUNNER_TEMP/release.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download the digests the tag run recorded
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-digests
          path: ${{ runner.temp }}/release-digests
          run-id: ${{ steps.fetch.outputs.run_id }}
          github-token: ${{ github.token }}

      # The downloaded draft is this tag's release: the wrappers and manifest
      # this commit produces, six SAIAI programs without AITP brand data.
      - name: Verify the release assets
        shell: bash
        run: |
          set -euo pipefail
          [ "$(wc -l <"$RUNNER_TEMP/release-digests/release-digests.sha256")" -eq 10 ]
          sha256sum --check --strict "$RUNNER_TEMP/release-digests/release-digests.sha256"
          for wrapper in setup.sh setup.ps1 setup.cmd; do
            cmp "scripts/saiai-cli/$wrapper" "dist/$wrapper"
          done
          chmod +x dist/setup.sh dist/saiai-linux-* dist/saiai-macos-*
          python3 scripts/saiai-cli/generate-manifest.py \
            --dist dist \
            --cargo-toml tools/saiai-cli/Cargo.toml \
            --wrappers-dir dist \
            --output "$RUNNER_TEMP/manifest.json"
          cmp "$RUNNER_TEMP/manifest.json" dist/manifest.json
          python3 scripts/saiai-cli/verify-linux-portability.py \
            dist/saiai-linux-x86_64 \
            dist/saiai-linux-aarch64
          python3 scripts/saiai-cli/verify-release.py \
            --artifact dist/saiai-linux-x86_64 \
            --artifact dist/saiai-linux-aarch64 \
            --artifact dist/saiai-macos-x86_64 \
            --artifact dist/saiai-macos-aarch64 \
            --artifact dist/saiai-windows-x86_64.exe \
            --artifact dist/saiai-windows-aarch64.exe
          python3 scripts/saiai-cli/test-release-bundle.py \
            --bundle dist \
            --setup-sh dist/setup.sh
          python3 scripts/saiai-cli/verify-github-release-draft.py \
            --dist dist \
            --tag "$GITHUB_REF_NAME" \
            --state "${{ steps.fetch.outputs.state }}" \
            <"$RUNNER_TEMP/release.json"

      - name: Publish immutable release
        if: steps.fetch.outputs.state == 'draft'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.fetch.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          release_json="$RUNNER_TEMP/published.json"

          # Re-read this release right before publishing: still the draft whose
          # names, sizes and digests match the checked assets.
          gh api "$release_endpoint" >"$RUNNER_TEMP/before-publish.json"
          python3 scripts/saiai-cli/verify-github-release-draft.py --dist dist --tag "$GITHUB_REF_NAME" --state draft <"$RUNNER_TEMP/before-publish.json"

          publish_status=0
          payload='{"draft":false,"prerelease":false}'
          printf '%s' "$payload" | gh api --method PATCH "$release_endpoint" --input - >/dev/null || publish_status=$?
          echo "publish request status: $publish_status"

          # Wait until GitHub reports the release published; the final check
          # below decides.
          for attempt in 1 2 3 4 5; do
            if [ "$(gh api "$release_endpoint" --jq .draft)" = false ]; then
              break
            fi
            sleep 2
          done
          gh api "$release_endpoint" >"$release_json"
          python3 scripts/saiai-cli/verify-github-release-draft.py --dist dist --tag "$GITHUB_REF_NAME" --state published <"$release_json"
