name: Windows candidate artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: tools/saiai-cli -> target

      - name: Build Windows candidate
        run: cargo build --locked --manifest-path tools/saiai-cli/Cargo.toml --release --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saiai-windows-candidate-${{ github.sha }}
          path: tools/saiai-cli/target/x86_64-pc-windows-msvc/release/saiai.exe
          if-no-files-found: error
          retention-days: 3
