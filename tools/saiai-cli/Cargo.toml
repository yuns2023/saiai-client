[package]
name = "saiai"
version = "1.1.59"
edition = "2024"
rust-version = "1.97"
description = "SAIAI managed local proxy for Claude Code and Codex configuration"
license = "MIT"
homepage = "https://saiai.top"
repository = "https://github.com/yuns2023/saiai-client"
publish = false

# The SAIAI distribution: the kernel (`kernel/`, crate `proxy_cli`) plus this
# distribution's brand values and Gateway extension. The release version is
# this package's.
[workspace]
members = ["kernel"]
default-members = [".", "kernel"]

[lib]
name = "saiai"
path = "src/distribution.rs"

[[bin]]
name = "saiai"
path = "src/main.rs"

[features]
# The kernel's test entry points, for this distribution's contract tests;
# never enabled for a release build.
contract = ["proxy-cli/contract"]

# Uses the contract entries from outside the library, as the SAIAI program's
# own crate will: `cargo test --features contract --test contract_entry`.
[[test]]
name = "contract_entry"
required-features = ["contract"]

[[test]]
name = "saiai_render_contract"
required-features = ["contract"]

[[test]]
name = "kernel_consumer"
required-features = ["contract"]

[dependencies]
proxy-cli = { path = "kernel" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = true, features = ["clock"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "std"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
zeroize = "1"

[dev-dependencies]
bytes = "1"
futures-util = "0.3"
# Lexes kernel sources for the file-reference contract scan.
proc-macro2 = "1"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = "0.23"
rustls-pemfile = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.16"

[target.'cfg(target_os = "windows")'.dev-dependencies]
dunce = "1"
