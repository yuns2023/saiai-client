[package]
name = "saiai"
version = "1.1.4"
edition = "2024"
rust-version = "1.97"
description = "SAIAI managed local proxy for Claude Code and Codex configuration"
license = "MIT"
homepage = "https://saiai.top"
repository = "https://github.com/yuns2023/saiai-client"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = true, features = ["clock"] }
futures-util = "0.3"
rand = "0.9"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml_edit = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
